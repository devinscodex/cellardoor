# Example reverse proxy for CellarDoor. Replace example.com and the certificate paths.
limit_req_zone $binary_remote_addr zone=cd_login:10m rate=10r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.com;
    ssl_certificate     /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    proxy_read_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the app trusts this header only from this proxy.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /login {
        limit_req zone=cd_login burst=5 nodelay;
        limit_req_status 429;
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:18480;
    }
    location = /logout  { limit_except POST { deny all; } proxy_pass http://127.0.0.1:18480; }
    location = /me      { proxy_pass http://127.0.0.1:18480; }
    location = /healthz { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:18480; }
    location /          { return 404; }
}
