# Example: put a path behind CellarDoor sign-in. Merge into the server block of the site that
# serves the files. Replace example.com. The login pages must be on the same host as the files,
# because the session cookie is host-only.
#
# auth_request runs before the cache lookup, so a cached file is still refused to anyone
# without a valid session.

location = /auth-check {
    internal;
    proxy_pass http://127.0.0.1:18480/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
}

location /music/ {
    auth_request /auth-check;
    error_page 401 = @login;
    # Optional, as on a caching relay:
    # slice 1m;
    # proxy_cache music;
    # proxy_cache_key $uri$slice_range;
    # proxy_set_header Range $slice_range;
    proxy_pass http://127.0.0.1:8096;   # the file origin
}

location @login {
    absolute_redirect off;
    return 302 /login?next=$request_uri;
}

# CellarDoor pages, same host:
location = /login    { proxy_pass http://127.0.0.1:18480; }
location = /logout   { proxy_pass http://127.0.0.1:18480; }
location = /invite   { proxy_pass http://127.0.0.1:18480; }
location = /password { proxy_pass http://127.0.0.1:18480; }
location = /me       { proxy_pass http://127.0.0.1:18480; }
